name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-windows:
    name: package (windows-latest, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read version from Cargo.toml
        id: version
        shell: bash
        run: |
          version="$(grep -m1 '^version *= *"' Cargo.toml | sed -E 's/version *= *"([^"]+)".*/\1/')"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build (release, MSVC)
        run: cargo build --release -p qsketch

      - name: Stage dist/windows
        shell: bash
        run: |
          mkdir -p dist/windows
          cp target/release/qsketch.exe dist/windows/
          cp LICENSE-MIT LICENSE-APACHE dist/windows/
          [ -f README.md ] && cp README.md dist/windows/ || true

      - name: Portable zip
        shell: pwsh
        run: |
          $version = "${{ steps.version.outputs.version }}"
          Compress-Archive -Path "dist/windows/*" -DestinationPath "dist/qsketch-$version-windows-portable.zip"

      - name: Install NSIS
        run: choco install nsis -y --no-progress

      - name: Build installer
        shell: bash
        run: |
          version="${{ steps.version.outputs.version }}"
          "/c/Program Files (x86)/NSIS/makensis.exe" -DVERSION="$version" installer/qsketch.nsi

      - uses: actions/upload-artifact@v4
        with:
          name: windows-release
          path: |
            dist/*-setup.exe
            dist/*-windows-portable.zip
          if-no-files-found: error

  build-linux:
    name: package (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (eframe/wgpu windowing)
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: ./scripts/build-linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux-release
          path: dist/*.tar.gz
          if-no-files-found: error

  release:
    name: Create GitHub release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/windows-release/*-setup.exe
            artifacts/windows-release/*-windows-portable.zip
            artifacts/linux-release/*.tar.gz
          generate_release_notes: true
