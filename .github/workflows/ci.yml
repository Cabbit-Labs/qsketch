name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

# A newer push supersedes an older run of the same branch or PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  # clippy and the tests share one checkout, one apt install and one build
  # cache, so they run in a single job (clippy first: it fails fastest).
  test:
    name: test (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies (eframe/wgpu windowing)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libxkbcommon-dev libwayland-dev libx11-dev \
            libxi-dev libxcursor-dev libxrandr-dev libgl1-mesa-dev pkg-config
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # qsketch-core is the stable, headless crate: hold it to a strict bar.
      - name: clippy (qsketch-core, deny warnings)
        run: cargo clippy -p qsketch-core --all-targets -- -D warnings
      - name: clippy (qsketch, deny warnings)
        run: cargo clippy -p qsketch --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  # The branch ruleset still requires a check named "clippy". The real
  # clippy run is the test job above; this reports its result under the
  # old name so the ruleset stays satisfiable until it is edited.
  clippy:
    name: clippy
    needs: test
    runs-on: ubuntu-latest
    steps:
      - run: echo "clippy ran (deny warnings) inside the test job"

  build-windows:
    name: build (windows-latest, MSVC)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Fast profile (see Cargo.toml); releases are built by release.yml.
      - run: cargo build --profile ci -p qsketch
      - uses: actions/upload-artifact@v4
        with:
          name: qsketch-windows-x86_64
          path: target/ci/qsketch.exe
          if-no-files-found: error
